<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dave Hannum — 3 layout directions</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f5f1ea; height: 100%; }
  body { font-family: "Geist", system-ui, sans-serif; }

  /* Force-shape iframes inside artboards */
  .preview-iframe {
    width: 100%; height: 100%;
    border: none;
    display: block;
    background: #fff;
  }

  /* Direction labels (cards under each artboard via DCSection subtitle) */
  .direction-summary {
    font-family: "Geist", sans-serif;
    font-size: 13px;
    color: #5a544a;
    line-height: 1.5;
    padding: 16px 4px 0;
    max-width: 540px;
  }
  .direction-summary strong { color: #1a1815; font-weight: 600; }
</style>
</head>
<body>

<div id="canvas-root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">
  const BOARD_W = 1280;
  const BOARD_H = 3600;

  function Preview({ src }) {
    return <iframe className="preview-iframe" src={src} title={src}></iframe>;
  }

  function App() {
    return (
      <DesignCanvas>
        <DCSection
          id="directions"
          title="davehannum.com · 3 layout directions"
          subtitle="Same content, three structures. Click any to focus fullscreen. Drag the grip to reorder."
        >
          <DCArtboard
            id="layout-a"
            label="A · Editorial Dark — current direction"
            width={BOARD_W}
            height={BOARD_H}
          >
            <Preview src="index.html" />
          </DCArtboard>

          <DCArtboard
            id="layout-b"
            label="B · Magazine Cover — light, editorial, portrait-led"
            width={BOARD_W}
            height={BOARD_H}
          >
            <Preview src="layouts/b-magazine.html" />
          </DCArtboard>

          <DCArtboard
            id="layout-c"
            label="C · Operator Portfolio — dark, modular, advisor-focused"
            width={BOARD_W}
            height={BOARD_H}
          >
            <Preview src="layouts/c-operator.html" />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById("canvas-root")).render(<App />);
</script>

</body>
</html>
